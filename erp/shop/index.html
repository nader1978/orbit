<style>
:root{--c:#0f766e;--c2:color-mix(in srgb,var(--c) 12%,#fff);--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--bg:#f6f7f9;--card:#fff;--ok:#15803d;--bad:#dc2626;--warn:#b45309;--r:16px;--sh:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.12);--f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
html[dir=rtl]{--f:'IBM Plex Sans Arabic','Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.55 var(--f);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
/* header */
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:14px;height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.logo i{width:36px;height:36px;border-radius:11px;background:var(--c);display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px;overflow:hidden}.logo i img{width:100%;height:100%;object-fit:cover}
.srch{flex:1;max-width:520px;margin-inline-start:auto;position:relative}.srch input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px 0 40px}html[dir=rtl] .srch input{padding:0 40px 0 14px}
.srch span{position:absolute;inset-inline-start:13px;top:10px;color:var(--mute)}
.ib{height:42px;min-width:42px;border-radius:12px;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;cursor:pointer;position:relative;padding:0 10px;font-weight:700;text-decoration:none}
.ib b{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--c);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
@media(max-width:720px){.srch{display:none}.hd{gap:8px}.logo span{max-width:150px;overflow:hidden;text-overflow:ellipsis}.msrch{display:block!important}}
.msrch{display:none;padding:0 0 10px}.msrch .srch{display:block;max-width:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
/* hero */
.hero{margin:18px 0 8px;border-radius:24px;padding:clamp(26px,5vw,56px);background:radial-gradient(600px 300px at 90% 10%,color-mix(in srgb,var(--c) 35%,transparent),transparent),linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#0f172a));color:#fff;position:relative;overflow:hidden}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,46px);line-height:1.1;letter-spacing:-.02em;max-width:620px}.hero p{opacity:.9;max-width:540px;font-size:16.5px;margin:12px 0 22px}
.hero .ul{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:14px;opacity:.95}.hero::after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;border:44px solid rgba(255,255,255,.08);inset-inline-end:-80px;bottom:-140px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:12px;border:0;background:var(--c);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn.w{background:#fff;color:var(--c)}.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.full{width:100%}.btn[disabled]{opacity:.5;cursor:not-allowed}
h2.t{font-size:21px;margin:26px 0 12px;letter-spacing:-.01em;display:flex;align-items:baseline;justify-content:space-between;gap:10px}h2.t a{font-size:14px;color:var(--c);text-decoration:none;font-weight:700}
/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.pc{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;position:relative;transition:transform .2s}.pc:hover{transform:translateY(-3px)}
.pc .im{aspect-ratio:1;background:#f1f5f9;display:block;position:relative}.pc .im img{width:100%;height:100%;object-fit:cover}
.bd{position:absolute;top:10px;inset-inline-start:10px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:700;border-radius:8px;padding:3px 8px}.bd.s{background:var(--bad)}
.pc .b{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}.pc h3{font-size:14.5px;margin:0;line-height:1.35;font-weight:600}.pc h3 a{text-decoration:none}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.pr b{font-size:17px}.pr s{color:var(--mute);font-size:13px}.pr small{color:var(--bad);font-weight:700;font-size:12px}
.av{font-size:12.5px;font-weight:600}.av.low{color:var(--warn)}.av.out{color:var(--bad)}.av.in{color:var(--ok)}.av.pre{color:#7c3aed}
.pc .add{margin-top:auto}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;height:42px}.qty button{width:40px;height:100%;border:0;background:none;cursor:pointer;font-size:18px;font-weight:700}.qty span{min-width:34px;text-align:center;font-weight:700}
.add .qty{width:100%;justify-content:space-between}
/* product page */
.pp{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;margin:22px 0}@media(max-width:860px){.pp{grid-template-columns:1fr;gap:18px}}
.gal .main{aspect-ratio:1;border-radius:20px;overflow:hidden;background:#fff;box-shadow:var(--sh)}.gal .main img{width:100%;height:100%;object-fit:cover}
.gal .th{display:flex;gap:8px;margin-top:10px}.gal .th button{width:70px;height:70px;border-radius:12px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:#fff}.gal .th button.on{border-color:var(--c)}.gal .th img{width:100%;height:100%;object-fit:cover}
.pi h1{font-size:clamp(22px,3vw,30px);margin:4px 0 8px;letter-spacing:-.01em;line-height:1.2}.pi .brand{color:var(--mute);font-weight:600;font-size:14px}.pi .pr b{font-size:26px}.pi .desc{color:#334155;white-space:pre-line}
.buy{display:flex;gap:10px;margin:18px 0}.buy .btn{flex:1}
.specs{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}.specs td{padding:9px 0;border-bottom:1px solid var(--line)}.specs td:first-child{color:var(--mute);width:40%}
.perks{display:grid;gap:8px;margin-top:16px;font-size:14px;color:#334155}
/* panels */
.panel{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:20px;margin:16px 0}.panel h3{margin:0 0 12px;font-size:17px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}.two>*{min-width:0}@media(max-width:900px){.two{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;flex:1;min-width:150px}.f label{font-size:13px;font-weight:600;color:#334155}.f input,.f select,.f textarea{height:46px;border-radius:12px;border:1px solid var(--line);padding:0 13px;background:#fff;outline:none;width:100%}.f textarea{height:84px;padding:10px 13px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}.f .er{color:var(--bad);font-size:12.5px}.f.bad input,.f.bad select{border-color:var(--bad)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.opts{display:grid;gap:10px}.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;background:#fff}.opt.on{border-color:var(--c);background:var(--c2)}.opt input{margin-top:4px;accent-color:var(--c)}.opt small{display:block;color:var(--mute)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.days button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;text-align:center;min-width:72px}.days button.on{border-color:var(--c);background:var(--c2);font-weight:700}.days small{display:block;color:var(--mute);font-size:12px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14.5px}.sum .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:18px;font-weight:800}.sum .neg{color:var(--ok)}
.li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.li img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#f1f5f9}.li h4{margin:0;font-size:14.5px;font-weight:600}.li .x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:13px;padding:0}
.note{border-radius:12px;padding:11px 14px;font-size:14px;margin:10px 0}.note.w{background:#fffbeb;color:#92400e}.note.e{background:#fef2f2;color:#991b1b}.note.i{background:var(--c2);color:color-mix(in srgb,var(--c) 70%,#000)}.note.ok{background:#f0fdf4;color:#166534}

.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:#fff;z-index:51;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}html[dir=rtl] .drawer{transform:translateX(-105%)}.drawer.on{transform:none!important}
.drawer .h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.drawer .h h3{margin:0}.drawer .bdy{flex:1;overflow:auto;padding:4px 18px}.drawer .ft{padding:16px 18px;border-top:1px solid var(--line)}
/* tracking */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:18px 0 8px}.steps div{text-align:center;font-size:12px;color:var(--mute);position:relative;padding-top:30px}.steps div::before{content:"";position:absolute;top:8px;left:50%;translate:-50% 0;width:16px;height:16px;border-radius:50%;background:var(--line);z-index:1}
.steps div::after{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line)}.steps div:first-child::after{display:none}.steps .on{color:var(--ink);font-weight:700}.steps .on::before,.steps .on::after{background:var(--c)}
html[dir=rtl] .steps div::after{left:auto;right:-50%}
.tl div{padding:8px 0 8px 18px;border-inline-start:2px solid var(--line);position:relative;font-size:14px}html[dir=rtl] .tl div{padding:8px 18px 8px 0}.tl div::before{content:"";position:absolute;inset-inline-start:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--c)}.tl small{color:var(--mute);display:block}
footer{margin-top:50px;background:#0f172a;color:#cbd5e1;padding:36px 0 90px;font-size:14px}footer .fc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:22px}footer a{color:#e2e8f0;text-decoration:none;display:block;margin:5px 0}footer h4{color:#fff;margin:0 0 8px}
.toast{position:fixed;bottom:22px;left:50%;translate:-50% 20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;opacity:0;transition:all .25s;pointer-events:none;max-width:92vw}.toast.on{opacity:1;translate:-50% 0}
.mbar{position:fixed;bottom:0;left:0;right:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;gap:10px;align-items:center}@media(max-width:860px){.mbar.on{display:flex}}
.empty{text-align:center;padding:50px 10px;color:var(--mute)}.empty b{display:block;font-size:44px}
.sk{background:linear-gradient(90deg,#eef2f7,#f8fafc,#eef2f7);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r)}@keyframes sk{to{background-position:-200% 0}}
.demo{background:#fef3c7;color:#92400e;text-align:center;font-size:13px;padding:6px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    if (a.id === 'locBtn') { if (!navigator.geolocation) return; navigator.geolocation.getCurrentPosition(p => { CO.lat = +p.coords.latitude.toFixed(5); CO.lng = +p.coords.longitude.toFixed(5); render(); }, () => toast('📍 ✕')); return; }
    if (a.id === 'tGo') { const no = $('#tNo').value.trim().toUpperCase(), ph = $('#tPh').value; if (!no || !S.phoneOk(ph)) return toast(t('badPhone')); showTrack(no, S.phone(ph), $('#trk')); return; }
    if (a.dataset.retrack) return showTrack(a.dataset.retrack, a.dataset.ph, $('#trk'));
    if (a.id === 'meSave') { const me = LS.get('me', {}); document.querySelectorAll('[data-me]').forEach(x => { me[x.dataset.me] = x.value; }); LS.set('me', me); toast('✓ ' + t('saved')); return; }
    if (a.dataset.cancel) { if (!confirm(t('cancelQ'))) return; if (DEMO) { const all = LS.get('demo_orders', {}); if (all[a.dataset.cancel]) { all[a.dataset.cancel].cancel = 1; LS.set('demo_orders', all); } } else await api({ a: 'cancel', no: a.dataset.cancel, phone: a.dataset.ph }); toast(t('cancelled')); return showTrack(a.dataset.cancel, a.dataset.ph, $('#trk')); }
    if (a.dataset.payagain) { const no = a.dataset.payagain, back = location.href.split('#')[0] + '#/done/' + no; try { const r = await api({ a: 'pay', no, amount: Number(a.dataset.total), currency: cur, ok: back + '?paid=1', cancel: back + '?paid=0' }); const mine = LS.get('orders', []), o = mine.find(x => x.no === no); if (o) { o.payRef = r.ref; LS.set('orders', mine); } await api({ a: 'paid', no, ref: r.ref }); location.href = r.url; } catch (x) { toast(t('payFail')); } }
  });
  document.addEventListener('input', e => { const x = e.target; if (x.dataset.co && CO) { CO[x.dataset.co] = x.type === 'checkbox' ? x.checked : x.value; if (CO.err[x.dataset.co]) { delete CO.err[x.dataset.co]; } if (x.dataset.co === 'emirate') render(); }
    if (x.id === 'q' || x.id === 'q2') { clearTimeout(x._t); x._t = setTimeout(() => { location.hash = x.value.trim() ? '#/s/' + encodeURIComponent(x.value.trim()) : '#/'; }, 300); } });
  document.addEventListener('change', async e => { const x = e.target; if (x.dataset.pay) { CO.pay = x.dataset.pay; render(); } if (x.dataset.co && x.type === 'checkbox') { CO[x.dataset.co] = x.checked; if (x.dataset.co === 'agree') { delete CO.err.agree; render(); } } if (x.dataset.co === 'emirate' && CO) { CO.emirate = x.value; delete CO.err.emirate; render(); }
    if (x.dataset.proof && x.files[0]) { const f = x.files[0]; try { const data = await shrink(f); if (DEMO) { const all = LS.get('demo_orders', {}); if (all[x.dataset.proof]) { all[x.dataset.proof].proof = 1; LS.set('demo_orders', all); } } else await api({ a: 'proof', no: x.dataset.proof, phone: x.dataset.ph, type: data.type, data: data.b64 }); toast('✓ ' + t('uploaded')); showTrack(x.dataset.proof, x.dataset.ph, $('#trk')); } catch (er) { toast('✕ ' + er.message); } } });
  /* pictures are made smaller before sending (max 1600 px); PDFs up to 3 MB */
  async function shrink(f) { if (f.type === 'application/pdf') { if (f.size > 3e6) throw new Error('PDF > 3 MB'); return { type: f.type, b64: await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(f); }) }; }
    const im = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = URL.createObjectURL(f); }), s = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    return { type: 'image/jpeg', b64: c.toDataURL('image/jpeg', .82).split(',')[1] }; }
  addEventListener('hashchange', () => { if (!location.hash.startsWith('#/checkout')) CO = null; render(); scrollTo(0, 0); });
  addEventListener('keydown', e => { if (e.key === 'Escape') openCart(false); });
  chrome();
  loadCatalog().then(c => { CAT = c; cur = c.shop.cur || 'AED'; saveCart(); chrome(); render(); }).catch(e => { $('#app').innerHTML = `<div class="empty"><b>⚠️</b>${L === 'ar' ? 'تعذّر تحميل المتجر، حاول لاحقاً.' : 'The shop could not be loaded — please try again later.'}</div>`; console.error(e); });
})();
</script>
